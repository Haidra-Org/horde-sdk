repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -    id: ruff-check
    -    id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
        args: [., --strict, --ignore-missing-imports, --exclude=^codegen]
        pass_filenames: false
        additional_dependencies: [
            pytest,
            pydantic>=2.9.2,
            logfire,
            types-Pillow,
            types-requests,
            types-pytz,
            types-setuptools,
            types-urllib3,
            types-aiofiles,
            types-PyYAML,
            StrEnum,
            horde_model_reference>=4.0.0
        ]
-   repo: local
    hooks:
    -   id: docs-fast
        name: documentation fast checks
        entry: uv run python docs/check_docs.py --fast
        language: system
        pass_filenames: false
        files: ^(docs/|examples/docs/|horde_sdk/.*\.py$|tests/docs/|zensical\.toml$)
