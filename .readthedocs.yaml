version: 2

submodules:
  include: all
  recursive: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - uv run python docs/build_site.py --clean --strict --site-url "${READTHEDOCS_CANONICAL_URL}"
    post_build:
      - mkdir -p "${READTHEDOCS_OUTPUT}/html/"
      - cp --recursive site/* "${READTHEDOCS_OUTPUT}/html/"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
